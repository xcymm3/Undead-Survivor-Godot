[preset.0]
name="Windows Steam x64"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/data/*.json,assets/THIRD-PARTY-NOTICES.txt,assets/models/WEAPON-SOURCES.md,assets/models/characters/License.txt,steam_appid.txt"
exclude_filter="docs/*,tools/*,.runtime/*,node_modules/*,artifacts/*,tests/*,test-results/*,playwright-report/*,.github/*"
export_path="build/Undead-Survivor-Godot.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug="res://.runtime/steam/godotsteam.45.debug.template.windows64.exe"
custom_template/release="res://.runtime/steam/godotsteam.45.template.windows64.exe"
debug/export_console_wrapper=1
binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://icon.svg"
application/file_version="1.7.8.0"
application/product_version="1.7.8.0"
application/product_name="Undead Survivor Godot"
application/file_description="Undead Survivor native Godot port"

[preset.1]
name="Web QA"
platform="Web"
runnable=false
advanced_options=false
dedicated_server=false
custom_features="automation"
export_filter="all_resources"
include_filter="assets/data/*.json"
