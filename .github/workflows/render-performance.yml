name: 静态场景渲染配对性能测试
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .runtime/Godot_v4.5.2-stable_win64.exe
            .runtime/Godot_v4.5.2-stable_win64_console.exe
            .runtime/steam
            .runtime/templates
          key: windows-godot-4.5.2-steam-4.16-${{ hashFiles('tools/setup-runtime.ps1', 'tools/setup-web-templates.ps1') }}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --only-shell
      - run: npm run verify
      - run: ./tools/validate-headless.ps1 -Mode Defense
      - run: ./tools/setup-web-templates.ps1
      - run: node tools/render-performance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: render-performance-${{ github.sha }}
          path: |
            artifacts/render-performance/manifest.json
            artifacts/render-performance/*-export.log
            artifacts/acceptance.json
          retention-days: 30
