name: Godot 自动验收与 Windows 打包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      visual_only:
        description: '仅执行整备场景隔离截图，不打包 EXE'
        type: boolean
        default: false
      visual_scope:
        description: 隔离截图范围
        type: choice
        options: [switch, normal, face, toys, shield_blade, blade_attack, noon, axe_gif, map_toys, ultimate_ring, dialogs, all]
        default: switch
      enemy_lab_counts:
        description: 'CPU正式矩阵人数（完整或300只重点确认）'
        type: choice
        options: ['50,100,200,300', '300']
        default: '50,100,200,300'
      enemy_profile_only:
        description: '仅运行隔离尸潮 CPU 独立实验，不渲染或打包 EXE'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparation-visual:
    if: inputs.visual_only == true && inputs.enemy_profile_only != true
    uses: ./.github/workflows/preparation-visual.yml
    with:
      scope: ${{ inputs.visual_scope || 'switch' }}
  enemy-cpu-experiments:
    if: inputs.enemy_profile_only == true
    uses: ./.github/workflows/enemy-cpu-experiments.yml
    with:
      formal_counts: ${{ inputs.enemy_lab_counts || '50,100,200,300' }}
  verify-and-package:
    if: inputs.visual_only != true && inputs.enemy_profile_only != true
    name: 技术门禁 → EXE 验收 → 打包
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 缓存固定引擎及导出模板
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .runtime/Godot_v4.5.2-stable_win64.exe
            .runtime/Godot_v4.5.2-stable_win64_console.exe
            .runtime/steam
            .runtime/templates
          key: windows-godot-4.5.2-steam-4.16-${{ hashFiles('tools/setup-runtime.ps1', 'tools/setup-web-templates.ps1') }}
      - name: 安装锁定的测试依赖
        run: npm ci --no-audit --no-fund
      - name: 安装无界面浏览器
        run: npx playwright install chromium --only-shell
      - name: 执行验收并导出 Windows 包
        run: npm run verify:release
      - name: 写入验收摘要
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/acceptance.md) {
            Get-Content -Encoding utf8 artifacts/acceptance.md >> $env:GITHUB_STEP_SUMMARY
          } else {
            '流程未进入验收阶段，请检查安装步骤日志。' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: 保存日志、截图和浏览器回放
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
      - name: 提供已验收的 Windows 下载包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Undead-Survivor-Godot-Windows-x64-${{ github.sha }}
          path: |
            build/Undead-Survivor-Godot-Windows-x64.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: 发布 GitHub Release
    needs: verify-and-package
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: 下载本次验收通过的 Windows 包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Undead-Survivor-Godot-Windows-x64-${{ github.sha }}
          path: release-assets
      - name: 校验并发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'release-assets/Undead-Survivor-Godot-Windows-x64.zip'
          $expected = ((Get-Content release-assets/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'ZIP checksum mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath release-assets/unpacked -Force
          $exe = 'release-assets/unpacked/Undead-Survivor-Godot.exe'
          $exeExpected = ((Get-Content release-assets/SHA256SUMS.txt | Where-Object { $_ -match '  Undead-Survivor-Godot\.exe$' }) -split '\s+')[0]
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $exeExpected) { throw 'EXE checksum mismatch.' }
          $version = (Get-Content -Raw -Encoding utf8 release-assets/unpacked/VERSION).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Invalid packaged version.' }
          $tag = "v$version"
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_REF.Substring(10) -ne $tag) { throw 'Git tag and packaged version disagree.' }
          $existing = & gh release view $tag --json isDraft 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and -not ($existing | ConvertFrom-Json).isDraft) {
            Write-Host "Release $tag is already published; leaving its assets unchanged."
            exit 0
          }
          @"
          本版重做保卫水晶的开局动线：从吊桥入口出生，依次经过吊桥、水晶与商店；每次重新进入都需要修复破损水晶，修复完成立刻开启第一波，移除拉杆开波。
          新增首次轮回字幕：四段依次淡入淡出，每段5秒；字幕结束前隐藏并禁用E交互，完成后保存在当前存档中。
          玩家死亡时保留当局水晶血量和外观，重新进入后才恢复为破损状态。结算界面改为游戏战报，区分守卫阵亡与水晶摧毁，展示真实统计及收益。
          消防斧支持连点与长按左右连续劈砍，扩大横向动作幅度；移除步枪拉栓、手枪旋转和消防斧切换表演及其专用音频。
          僵尸死亡、枪械换弹、拔收刀、挥刀、脚步、推搡撞击、分材质护甲反馈、枪声与大招音乐替换为现成CC0素材；换弹录音按动作进度播放，支持暂停、取消与逐发循环。
          提高吊桥边缘防跳保护，栅栏支持整个门面交互；地雷保留待机闪灯并共用手雷爆炸音效，首次小鬼波的普通僵尸替换为路障僵尸。
          炮塔、地雷与展台恢复原外观，水晶保留玩具造型并移除三圈灰色接缝。移除入口说明牌，初始目标简化为“修复水晶”。
          保留游戏风格设置与三存档界面；移除手雷充能环，仅显示加粗的渐变蓝大招充能环。旧存档继续兼容，三个存档的成长进度独立保存。
          推荐直接下载 **Undead-Survivor-Godot.exe**，双击即可启动，无需另下 DLL 或 appid。
          EXE 内置游戏和依赖，运行时自动解压到临时目录，退出后清理；当前提供单人模式，多人入口暂时关闭。
          ZIP 内也包含相同的单文件 EXE。启动器使用 Windows 自带的 .NET Framework 4.x。

          源码提交：$env:RELEASE_COMMIT
          [自动验收记录](https://github.com/$env:GH_REPO/actions/runs/$env:RELEASE_RUN_ID)：基础规则、水晶防守专项、弹道、浏览器技术检查、成品 EXE 及单文件隔离启动检查通过。脚本试玩和全部联机测试未纳入本次发布门禁。
          Steam 跨账号联机、脚本通关、原生 GPU 画面、实际音效听感与真人体验不属于此次自动发布门禁。趣味性与难度仍需真人验收，技术检查通过不代表平衡达标。
          "@ | Set-Content -Encoding utf8 release-notes.md
          if (-not $exists) {
            & gh release create $tag --target $env:RELEASE_COMMIT --title "Undead Survivor $tag" --notes-file release-notes.md --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          $files = @($zip, 'release-assets/SHA256SUMS.txt') + @(Get-ChildItem release-assets/unpacked -File | ForEach-Object { $_.FullName })
          & gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          & gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
