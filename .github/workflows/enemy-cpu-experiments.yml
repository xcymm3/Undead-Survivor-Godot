name: 尸潮独立 CPU 对照实验
on:
  workflow_call:
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .runtime/Godot_v4.5.2-stable_win64.exe
            .runtime/Godot_v4.5.2-stable_win64_console.exe
            .runtime/steam
            .runtime/templates
          key: windows-godot-4.5.2-steam-4.16-${{ hashFiles('tools/setup-runtime.ps1', 'tools/setup-web-templates.ps1') }}
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: 串行运行独立实验及分段诊断
        run: node tools/run-enemy-experiments.mjs --diagnostics
      - run: node tools/summarize-enemy-experiments.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enemy-cpu-experiments-${{ github.sha }}
          path: |
            artifacts/enemy-experiments/
            docs/performance/
            artifacts/acceptance.json
          retention-days: 30
