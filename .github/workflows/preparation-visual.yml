name: 整备场景隔离截图
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: 截图范围
        default: all
        options: [all, switch, normal, face, toys]
  workflow_call:
    inputs:
      scope:
        type: string
        default: switch
permissions:
  contents: read
jobs:
  visual:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .runtime/Godot_v4.5.2-stable_win64.exe
            .runtime/Godot_v4.5.2-stable_win64_console.exe
            .runtime/steam
            .runtime/templates
          key: windows-godot-4.5.2-steam-4.16-${{ hashFiles('tools/setup-runtime.ps1', 'tools/setup-web-templates.ps1') }}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --only-shell
      - run: npm run verify
      - run: ./tools/validate-headless.ps1 -Mode Defense
      - run: ./tools/setup-web-templates.ps1
      - name: 导出软件渲染场景
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/web | Out-Null
          & ./.runtime/Godot_v4.5.2-stable_win64_console.exe --headless --audio-driver Dummy --path . --export-release 'Web QA'
          if ($LASTEXITCODE -ne 0) { throw 'Web export failed' }
      - run: npx playwright test tests/browser/campaign-review.spec.mjs tests/browser/defense.spec.mjs
        env:
          QA_TOYS_ONLY: ${{ inputs.scope == 'toys' && '1' || '' }}
          QA_FACE_ONLY: ${{ inputs.scope == 'face' && '1' || '' }}
          QA_NORMAL_ONLY: ${{ inputs.scope == 'normal' && '1' || '' }}
          QA_SWITCH_ONLY: ${{ inputs.scope == 'switch' && '1' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preparation-review-${{ github.sha }}
          path: artifacts/
          retention-days: 14
